name: Build Android APK

# Builds an installable APK on GitHub's runners, which have the Android SDK.
# The result is attached to the run as a downloadable artifact and published to
# a rolling pre-release, so it can be installed on a phone straight from the
# browser without a development machine.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8 requires 17. Newer JDKs fail with an obscure Kotlin error
          # rather than a clear version complaint, so this is pinned.
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app was developed and tested against.
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # No key.properties in CI, so the release build falls back to debug
      # signing — installable on a phone, and rejected by Play, which is
      # exactly what a test build should be.
      # Split per ABI. A universal APK carries native code for arm64, arm32 and
      # x86_64 at once and comes to ~64 MB, of which any given phone uses about
      # a third. The arm64 slice is ~22 MB and is what every phone sold in the
      # last several years actually runs.
      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Name the build
        id: name
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app-$abi-release.apk"
            [ -f "$src" ] && mv "$src" "$GITHUB_WORKSPACE/voix-${{ steps.name.outputs.sha }}-$abi.apk"
          done
          ls -lh "$GITHUB_WORKSPACE"/voix-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: voix-apk
          path: voix-*.apk
          retention-days: 30

      # A release asset has a direct download URL that works in a phone
      # browser; a workflow artifact is a zip that phones handle badly.
      - name: Publish to the test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Latest test build
          body: |
            Automatic test build of Voix.

            **Which file:** take the `arm64-v8a` one. That is every Android
            phone sold in roughly the last decade. Only reach for
            `armeabi-v7a` if that one refuses to install, and `x86_64` is for
            emulators.

            **Install:** download it on your phone and open it. Android will
            warn about installing from an unknown source — allow it for your
            browser, then install.

            Signed with debug keys, so this cannot be uploaded to Play. It is
            for trying the app on a real device.

            Commit: ${{ github.sha }}
          files: voix-*.apk
          prerelease: true
          make_latest: false
