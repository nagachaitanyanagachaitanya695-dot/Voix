name: Build Android APK

# Builds an installable APK on GitHub's runners, which have the Android SDK.
# The result is attached to the run as a downloadable artifact and published to
# a rolling pre-release, so it can be installed on a phone straight from the
# browser without a development machine.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8 requires 17. Newer JDKs fail with an obscure Kotlin error
          # rather than a clear version complaint, so this is pinned.
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app was developed and tested against.
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Sign with the committed throwaway key rather than letting Gradle fall
      # back to a debug key.
      #
      # The runner has no ~/.android/debug.keystore, so Gradle generates one —
      # a different one on every run. Android will not install an APK over an
      # app signed with a different key: it says "App not installed" and gives
      # no reason. That made every build after the first uninstallable without
      # wiping the app and its progress first.
      #
      # This key cannot reach Play. The upload key lives in key.properties,
      # which is gitignored and not present here, so a build made by CI is
      # still rejected at upload — which is what a test build should be.
      - name: Use the shared test signing key
        run: |
          cat > android/key.properties <<'PROPS'
          storeFile=../test-signing.jks
          storePassword=voixtest
          keyAlias=voixtest
          keyPassword=voixtest
          PROPS

      #
      # VOIX_TESTING turns on the in-app testing screen, where the Worker's
      # address can be typed in. Without it a CI build has no backend at all —
      # CI cannot hold your secrets — and the live call is unreachable no
      # matter what else is right. A Play release is built without this flag,
      # because the screen can unlock Premium locally.
      #
      # Two shapes are built, for different situations. The universal APK
      # carries native code for every architecture at once (~64 MB) and is the
      # one to reach for when you just want the app on a phone, because it
      # cannot pick the wrong slice. The per-ABI APKs are a third of that,
      # worth it on a slow connection if you know which one your phone needs.
      - name: Build universal APK
        run: flutter build apk --release --dart-define=VOIX_TESTING=true

      - name: Name the build
        id: name
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set aside the universal APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "$GITHUB_WORKSPACE/voix-${{ steps.name.outputs.sha }}.apk"

      - name: Build per-ABI APKs
        run: flutter build apk --release --split-per-abi --dart-define=VOIX_TESTING=true

      - name: Rename per-ABI APKs
        run: |
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="app-$abi-release.apk"
            [ -f "$src" ] && mv "$src" "$GITHUB_WORKSPACE/voix-${{ steps.name.outputs.sha }}-$abi.apk"
          done
          ls -lh "$GITHUB_WORKSPACE"/voix-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: voix-apk
          path: voix-*.apk
          retention-days: 30

      # Clear the previous build's files off the release first.
      #
      # Assets accumulate otherwise — one APK per commit, all sitting on the
      # same page under near-identical names. Every older one is signed with a
      # different throwaway key, so tapping the wrong file gives "App not
      # installed" and looks like the build is broken. Leaving exactly one set
      # of files means there is nothing wrong to tap.
      - name: Remove the previous build's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test-build --json assets --jq '.assets[].name' \
            2>/dev/null > old-assets.txt || true
          while read -r asset; do
            [ -n "$asset" ] || continue
            echo "removing $asset"
            gh release delete-asset test-build "$asset" --yes || true
          done < old-assets.txt
          rm -f old-assets.txt

      # A release asset has a direct download URL that works in a phone
      # browser; a workflow artifact is a zip that phones handle badly.
      - name: Publish to the test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Latest test build
          body: |
            Automatic test build of Voix.

            **Which file:** take `voix-<commit>.apk` — the one with no
            architecture in its name. It works on every phone. It is larger
            because it contains the code for all of them.

            The `-arm64-v8a` / `-armeabi-v7a` / `-x86_64` files are the same
            app cut down to one architecture, about a third of the size. Only
            worth it on a slow connection, and only if you know which one your
            phone is — the wrong one will not install.

            **Install:** download it on your phone and open it. Android will
            warn about installing from an unknown source — allow it for your
            browser, then install.

            **To try the live call:** Profile → Settings → Testing. Paste your
            Cloudflare Worker's address and its APP_TOKEN, tap "Check
            connection", then turn on "Unlock Premium". The screen tells you
            what is wrong if it cannot reach the Worker.

            Signed with debug keys, so this cannot be uploaded to Play. It is
            for trying the app on a real device.

            Commit: ${{ github.sha }}
          files: voix-*.apk
          prerelease: true
          make_latest: false
