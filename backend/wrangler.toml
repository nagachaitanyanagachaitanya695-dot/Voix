name = "voix-backend"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Model IDs live here rather than in the app, so you can change them without
# shipping an update — and so the app can never request a costlier model than
# you allow.
#
# CHECK THIS AGAINST OPENAI'S CURRENT MODEL LIST BEFORE DEPLOYING.
# Model names change, and a wrong one fails at runtime with a 400.
# https://platform.openai.com/docs/models
#
# A small model is the right default here: the tutor writes two or three
# sentences at a time, which is not work that needs an expensive model.
CHAT_MODEL = "gpt-4o-mini"

# Live voice-to-voice, for subscribers only.
REALTIME_MODEL = "gpt-realtime"
TRANSCRIBE_MODEL = "whisper-1"

# Your app's package name, checked against the Play purchase.
ANDROID_PACKAGE_NAME = "com.voix.voix"

# Requests per device per day. One conversation is roughly one request per
# thing the learner says, plus one for the end-of-session report.
DAILY_CHAT_LIMIT = "300"

# Live voice sessions per device per day. Billed per minute of audio in both
# directions, so this is the number that decides whether a subscription earns
# money or loses it. Twelve is already generous; work out what one session
# costs before raising it.
DAILY_VOICE_LIMIT = "12"

# Enforces the caps above. Create it with:
#   npx wrangler kv namespace create VOIX_KV
# then paste the printed id below and uncomment.
# Without it the Worker runs but enforces no limit at all.
# [[kv_namespaces]]
# binding = "VOIX_KV"
# id = "paste-the-id-wrangler-prints"

# Secrets are NOT set here — this file is committed to git.
# Set them from the terminal instead:
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put APP_TOKEN
#   npx wrangler secret put PLAY_SERVICE_ACCOUNT_JSON   (the whole JSON file)
