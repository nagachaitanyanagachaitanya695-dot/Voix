name: voix
description: >-
  VOIX — Your personal AI language tutor. Learn to speak a new language
  confidently by having real conversations with AI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # Local persistence / offline cache
  shared_preferences: ^2.3.2
  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # Talking to the Voix backend (see backend/README.md).
  http: ^1.6.0
  # Subscriptions, through Google Play Billing. Play supports UPI in India, and
  # selling an in-app feature any other way is a Play policy problem.
  in_app_purchase: any
  # Live voice-to-voice, for subscribers only.
  web_socket_channel: any
  record: any
  flutter_pcm_sound: any
  # Songs: picking an audio file, and playing it back with a position stream
  # accurate enough to highlight lyrics in time with it.
  file_picker: ^8.1.4
  just_audio: ^0.9.42
  # Accounts and cloud sync. Optional at runtime — see lib/firebase_options.dart.
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  # Daily practice reminders. Pinned to the versions that resolve against
  # Flutter 3.35 — newer majors of flutter_local_notifications require 3.38+.
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # Display / UI typeface — geometric, premium, excellent at large sizes.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    # Indic scripts. Plus Jakarta Sans and Manrope are Latin-only, so without
    # these every native language name — తెలుగు, हिन्दी, தமிழ் — renders as
    # empty boxes. That is the app's own audience reading its own language as
    # rubble, so these ship with the app rather than relying on whatever the
    # device happens to have.
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTelugu-700.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-700.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTamil-700.ttf
          weight: 700
    # Numeric / stat typeface — tighter, tabular-feeling for XP, streaks, scores.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
