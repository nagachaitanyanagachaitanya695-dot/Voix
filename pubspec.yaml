name: voix
description: >-
  VOIX — Your personal AI language tutor. Learn to speak a new language
  confidently by having real conversations with AI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # Local persistence / offline cache
  shared_preferences: ^2.3.2
  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # Live voice-to-voice. Only used when the learner opts into it; the free
  # on-device speech path above works with none of these.
  web_socket_channel: any
  record: any
  flutter_pcm_sound: any
  http: any
  # Accounts and cloud sync. Optional at runtime — see lib/firebase_options.dart.
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^7.2.0
  # Daily practice reminders. Pinned to the versions that resolve against
  # Flutter 3.35 — newer majors of flutter_local_notifications require 3.38+.
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # Display / UI typeface — geometric, premium, excellent at large sizes.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    # Numeric / stat typeface — tighter, tabular-feeling for XP, streaks, scores.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
